services:
  coolify:
    image: ghcr.io/makeouthillx32/coolify:latest
    pull_policy: always
    ports:
      - "${APP_PORT:-8002}:8080"
    environment:
      AUTORUN_ENABLED: false
      PHP_OPCACHE_ENABLE: 1
      PUSHER_HOST: "${PUSHER_HOST}"
      PUSHER_PORT: "${PUSHER_PORT}"
      PUSHER_SCHEME: "${PUSHER_SCHEME:-http}"
      PUSHER_APP_ID: "${PUSHER_APP_ID:-coolify}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY:-coolify}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-coolify}"
    volumes:
      - dev_coolify_data:/data/coolify
      - dev_backups_data:/var/www/html/storage/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - coolify
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    pull_policy: always
    container_name: postgres  # Match .env DB_HOST=postgres
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${DB_USERNAME:-coolify}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
      POSTGRES_DB: "${DB_DATABASE:-coolify}"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      - coolify
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    pull_policy: always
    container_name: redis  # Match .env REDIS_HOST=redis
    ports:
      - "6380:6379"
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - dev_redis_data:/data
    networks:
      - coolify
    restart: unless-stopped

  soketi:
    # BUILD LOCALLY instead of trying to pull non-existent image
    build:
      context: .
      dockerfile: ./docker/coolify-realtime/Dockerfile
    env_file:
      - .env
    ports:
      - "6002:6001"
      - "6003:6002"
    environment:
      SOKETI_DEBUG: "false"
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID:-coolify}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY:-coolify}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:-coolify}"
    networks:
      - coolify
    restart: unless-stopped

  vite:
    image: node:20-alpine
    pull_policy: always
    working_dir: /var/www/html
    environment:
      VITE_HOST: "${VITE_HOST:-localhost}"
      VITE_PORT: "${VITE_PORT:-5173}"
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/var/www/html/:cached
    command: sh -c "npm install && npm run dev"
    networks:
      - coolify
    restart: unless-stopped

  testing-host:
    # BUILD LOCALLY instead of trying to pull non-existent image
    build:
      context: .
      dockerfile: ./docker/testing-host/Dockerfile
    init: true
    container_name: coolify-testing-host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dev_coolify_data:/data/coolify
      - dev_backups_data:/data/coolify/backups
      - dev_postgres_data:/data/coolify/_volumes/database
      - dev_redis_data:/data/coolify/_volumes/redis
      - dev_minio_data:/data/coolify/_volumes/minio
    networks:
      - coolify
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    pull_policy: always
    container_name: coolify-mail
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - coolify
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    pull_policy: always
    container_name: coolify-minio
    command: server /data --console-address ":9001"
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - dev_minio_data:/data
    networks:
      - coolify
    restart: unless-stopped

volumes:
  dev_backups_data:
  dev_postgres_data:
  dev_redis_data:
  dev_coolify_data:
  dev_minio_data:

networks:
  coolify:
    name: coolify
    external: false
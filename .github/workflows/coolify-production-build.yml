name: Deploy to Server2

on:
  push:
    branches: ["v4.x"]
    paths-ignore:
      - templates/**
      - CHANGELOG.md

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v4.x'
    steps:
      - name: Deploy to Personal Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd D:\code\coolify
            docker-compose -f docker-compose.dev.yml build --no-cache coolify
            docker-compose -f docker-compose.dev.yml up -d --force-recreate coolify
            echo "🎉 Deployment complete! Access at https://cool.unenter.live"
name: Production Build (v4.0)

on:
  push:
    branches: ["v4.x"]
    paths-ignore:
      - .github/workflows/coolify-helper.yml
      - .github/workflows/coolify-helper-next.yml
      - .github/workflows/coolify-realtime.yml
      - .github/workflows/coolify-realtime-next.yml
      - docker/coolify-helper/Dockerfile
      - docker/coolify-realtime/Dockerfile
      - docker/testing-host/Dockerfile
      - templates/**
      - CHANGELOG.md

env:
  GITHUB_REGISTRY: ghcr.io
  IMAGE_NAME: "makeouthillx32/coolify"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Get Version
        id: version
        run: echo "VERSION=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/makeouthillx32/coolify:latest
            ghcr.io/makeouthillx32/coolify:${{ steps.version.outputs.VERSION }}

      - name: Deploy to Local Machine
        if: github.ref == 'refs/heads/v4.x'
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /d D:\code\coolify && docker pull ghcr.io/makeouthillx32/coolify:latest && docker-compose -f docker-compose.dev.yml down && docker-compose -f docker-compose.dev.yml up -d --pull never

      - name: Build Complete
        run: |
          echo "🎉 Docker image built and deployed successfully!"
          echo "📦 Image: ghcr.io/makeouthillx32/coolify:latest"
          echo "🚀 Deployed to your local development machine"
services:
  coolify-proxy:
    image: "ghcr.io/coollabsio/coolify-proxy:latest"
    container_name: coolify-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dev_coolify_data:/data/coolify
    networks:
      - coolify

  coolify:
    image: ghcr.io/makeouthillx32/coolify:latest
    container_name: coolify
    restart: always
    environment:
      APP_URL: "https://cool.unenter.live"
      APP_KEY: "${APP_KEY}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_HOST: "coolify-db"
      REDIS_HOST: "coolify-redis"
      IS_WINDOWS_DOCKER_DESKTOP: "true"
      SANCTUM_STATEFUL_DOMAINS: "cool.unenter.live,localhost,127.0.0.1,192.168.50.194"
    ports:
      - "8002:8080"
    volumes:
      - dev_coolify_data:/data/coolify
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - coolify
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: coolify-db
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE:-coolify}"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - coolify

  redis:
    image: redis:7-alpine
    container_name: coolify-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - dev_redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - coolify

  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    container_name: coolify-realtime
    ports:
      - "6002:6001"
      - "6003:6002"
    environment:
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID:-coolify}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY:-coolify}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:-coolify}"
    networks:
      - coolify

  vite:
    image: node:20-alpine
    container_name: coolify-vite
    working_dir: /var/www/html
    environment:
      VITE_HOST: "0.0.0.0" # Required for Docker access
      VITE_PORT: "5173"
    ports:
      - "5173:5173"
    volumes:
      - dev_coolify_data:/var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - coolify

  testing-host:
    image: ghcr.io/coollabsio/coolify-testing-host:latest
    container_name: coolify-testing-host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dev_coolify_data:/data/coolify
    networks:
      - coolify

  mailpit:
    image: axllent/mailpit:latest
    container_name: coolify-mail
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - coolify

  minio:
    image: minio/minio:latest
    container_name: coolify-minio
    command: server /data --console-address ":9001"
    ports:
      - "9003:9000"
      - "9004:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - dev_minio_data:/data
    networks:
      - coolify

  sentinel:
    image: ghcr.io/coollabsio/sentinel:latest
    container_name: coolify-sentinel
    environment:
      TOKEN: "${SENTINEL_TOKEN:-coolify}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    external: false

volumes:
  dev_coolify_data:
    external: true
    name: "coolify_dev_coolify_data"
  dev_postgres_data:
    external: true
    name: "coolify_dev_postgres_data"
  dev_redis_data:
    external: true
    name: "coolify_dev_redis_data"
  dev_minio_data:
    external: true
    name: "coolify_dev_minio_data"

services:
  coolify:
    image: "ghcr.io/coollabsio/coolify:latest"
    container_name: coolify
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - dev_coolify_data:/data/coolify
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - APP_ID=${APP_ID}
      - APP_KEY=${APP_KEY}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_HOST=coolify-db
      - REDIS_HOST=coolify-redis
      - APP_URL=https://cool.unenter.live
      - IS_WINDOWS_DOCKER_DESKTOP=true
      - SSL_MODE=off
      - PHP_PM_CONTROL=dynamic
      - PHP_PM_START_SERVERS=1
      - PHP_PM_MIN_SPARE_SERVERS=1
      - PHP_PM_MAX_SPARE_SERVERS=10
    ports:
      - "8002:8080"
    healthcheck:
      test: curl --fail http://localhost:8080/api/health || exit 1
      interval: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: "postgres:15-alpine"
    container_name: coolify-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-coolify}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}", "-d", "${DB_DATABASE:-coolify}"]
      interval: 5s
      retries: 10

  redis:
    image: "redis:7-alpine"
    container_name: coolify-redis
    restart: always
    command: redis-server --save 20 1 --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10

  coolify-proxy:
    image: "ghcr.io/coollabsio/coolify-proxy:latest"
    container_name: coolify-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dev_coolify_data:/data/coolify
    networks:
      - default
      - coolify

  soketi:
    image: "ghcr.io/coollabsio/coolify-realtime:latest"
    container_name: coolify-realtime
    restart: always
    ports:
      - "6002:6001"
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-coolify}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-coolify}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-coolify}

networks:
  coolify:
    name: coolify
    external: false

volumes:
  # Crucial: Mapping to your EXACT Windows volume names
  dev_coolify_data:
    external: true
    name: "coolify_dev_coolify_data"
  dev_postgres_data:
    external: true
    name: "coolify_dev_postgres_data"
  dev_redis_data:
    external: true
    name: "coolify_dev_redis_data"

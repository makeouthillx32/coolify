version: '3.8'
services:
  coolify:
    image: ghcr.io/makeouthillx32/coolify:latest
    pull_policy: always
    container_name: coolify
    ports:
      - "8000:8080"
    environment:
      APP_URL: "https://cool.unenter.live"
      SANCTUM_STATEFUL_DOMAINS: "cool.unenter.live,localhost,127.0.0.1,192.168.50.194"
      TRUSTED_PROXIES: "*"
      DB_HOST: "coolify-db"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: "coolify-redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      COOLIFY_STORAGE_TYPE: "local"
    volumes:
      - dev_coolify_data:/data/coolify
      # CORRECTED FIX: Use the Linux socket path for Docker Desktop compatibility
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - coolify
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
  postgres:
    image: postgres:15-alpine
    pull_policy: always
    container_name: coolify-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE}"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      - coolify
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    pull_policy: always
    container_name: coolify-redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - dev_redis_data:/data
    networks:
      - coolify
    restart: unless-stopped
volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_coolify_data:
networks:
  coolify:
    name: coolify
    external: false

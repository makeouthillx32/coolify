services:
  coolify-testing-host:
    init: true
    image: "ghcr.io/coollabsio/coolify-testing-host:latest"
    pull_policy: always
    container_name: coolify-testing-host
    volumes:
      - //var/run/docker.sock://var/run/docker.sock
      - ./:/data/coolify

  coolify:
    image: "ghcr.io/coollabsio/coolify:latest"
    pull_policy: always
    container_name: coolify
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./ssh:/var/www/html/storage/app/ssh
      - ./applications:/var/www/html/storage/app/applications
      - ./databases:/var/www/html/storage/app/databases
      - ./services:/var/www/html/storage/app/services
      - ./backups:/var/www/html/storage/app/backups
    environment:
      - APP_ID=${APP_ID:-1}
      - APP_ENV=production
      - APP_NAME=${APP_NAME:-Coolify}
      - APP_KEY=${APP_KEY:?Please provide an APP_KEY in Portainer variables}
      - DB_PASSWORD=${DB_PASSWORD:?Please provide a DB_PASSWORD in Portainer variables}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Please provide a REDIS_PASSWORD in Portainer variables}
      - SSL_MODE=off
      - PHP_PM_CONTROL=dynamic
      - PHP_PM_START_SERVERS=1
      - PHP_PM_MIN_SPARE_SERVERS=1
      - PHP_PM_MAX_SPARE_SERVERS=10
      - PUSHER_APP_ID=${PUSHER_APP_ID:-coolify}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-coolify}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-coolify}
      - AUTOUPDATE=true
      - SELF_HOSTED=true
      - SSH_MUX_ENABLED=false
      - IS_WINDOWS_DOCKER_DESKTOP=true
    ports:
      - "8002:8080"
    healthcheck:
      test: curl --fail http://localhost:8080/api/health || exit 1
      interval: 10s
      retries: 5
      timeout: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: coolify-db
    restart: always
    volumes:
      - coolify-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME:-coolify}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-coolify}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-coolify}", "-d", "${DB_DATABASE:-coolify}" ]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coolify-redis
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10

  soketi:
    image: 'ghcr.io/coollabsio/coolify-realtime:1.0.10'
    container_name: coolify-realtime
    restart: always
    ports:
      - "6002:6001"
      - "6003:6002"
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-coolify}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-coolify}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-coolify}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready && wget -qO- http://127.0.0.1:6002/ready || exit 1" ]
      interval: 5s
      retries: 10

volumes:
  coolify-db:
    name: coolify-db
  coolify-redis:
    name: coolify-redis

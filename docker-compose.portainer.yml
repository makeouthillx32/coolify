services:
  coolify:
    image: ghcr.io/coollabsio/coolify:latest
    pull_policy: always
    container_name: coolify
    ports:
      - "${APP_PORT:-8002}:8080"
    environment:
      APP_URL: "https://cool.unenter.live"
      SANCTUM_STATEFUL_DOMAINS: "cool.unenter.live,localhost,127.0.0.1,192.168.50.194"
      TRUSTED_PROXIES: "*"
      APP_KEY: "${APP_KEY}" 
      DB_HOST: "coolify-db"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_PORT: "5432"
      REDIS_HOST: "coolify-redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@coolify-redis:6379"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
    volumes:
      - dev_coolify_data:/data/coolify
      - dev_backups_data:/var/www/html/storage/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - coolify
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    pull_policy: always
    container_name: coolify-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "${DB_USERNAME:-coolify}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
      POSTGRES_DB: "${DB_DATABASE:-coolify}"
      POSTGRES_HOST_AUTH_METHOD: "md5"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      - coolify
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-coolify}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    pull_policy: always
    container_name: coolify-redis
    ports:
      - "6380:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - dev_redis_data:/data
    networks:
      - coolify
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    pull_policy: always
    container_name: coolify-soketi
    ports:
      - "6002:6001"
      - "6003:6002"
    environment:
      SOKETI_DEBUG: "false"
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID:-coolify}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY:-coolify}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:-coolify}"
    networks:
      - coolify
    restart: unless-stopped

  # ✅ ADDED: Sentinel for metrics and monitoring
  sentinel:
    image: ghcr.io/coollabsio/sentinel:latest
    pull_policy: always
    container_name: coolify-sentinel
    ports:
      - "8888:8888"
    environment:
      SENTINEL_METRICS_HISTORY_DAYS: "7"
    volumes:
      - dev_sentinel_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - coolify
    restart: unless-stopped
    privileged: true

  testing-host:
    image: ghcr.io/coollabsio/coolify-testing-host:latest
    pull_policy: always
    init: true
    container_name: coolify-testing-host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dev_coolify_data:/data/coolify
      - dev_backups_data:/data/coolify/backups
      - dev_postgres_data:/data/coolify/_volumes/database
      - dev_redis_data:/data/coolify/_volumes/redis
      - dev_minio_data:/data/coolify/_volumes/minio
    networks:
      - coolify
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    pull_policy: always
    container_name: coolify-mail
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - coolify
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    pull_policy: always
    container_name: coolify-minio
    command: server /data --console-address ":9001"
    ports:
      - "9003:9000"
      - "9004:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - dev_minio_data:/data
    networks:
      - coolify
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  dev_backups_data:
  dev_postgres_data:
  dev_redis_data:
  dev_coolify_data:
  dev_minio_data:
  dev_sentinel_data:

networks:
  coolify:
    name: coolify
    external: false
